{% extends "base.html" %}
{% block title %}Register - Restaurant World{% endblock %}
{% block content %}
<div class="form-card">
    <div class="form-title">Create an account 🍽</div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="POST" novalidate>
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" autofocus>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="At least 6 characters" minlength="6">
        </div>
        <div class="form-group" style="display:flex; align-items:center; gap:0.7rem; background:var(--light); padding:0.9rem; border-radius:8px; border:1.5px solid var(--border);">
            <input type="checkbox" name="is_owner" id="is_owner" style="width:18px; height:18px; accent-color:var(--red); cursor:pointer; flex-shrink:0;">
            <label for="is_owner" style="margin:0; cursor:pointer; font-weight:500;">
                I am a restaurant owner
                <span style="display:block; font-size:0.8rem; color:var(--gray); font-weight:400;">Check this to be able to add your restaurant</span>
            </label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
        </div>
    </form>
    <div class="form-link">Already have an account? <a href="{{ url_for('user.login') }}">Login</a></div>
</div>
{% endblock %}
